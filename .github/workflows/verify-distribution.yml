name: Verify distribution

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check Claude and Codex skill mirrors
        run: python scripts/sync_harness_skills.py --check
      - name: Verify package structure
        run: python scripts/verify_distribution.py
      - name: Test setup helpers
        run: python -m unittest discover -s scripts/tests -v
      - name: Build and verify the shareable zip
        run: python scripts/build_distribution.py
