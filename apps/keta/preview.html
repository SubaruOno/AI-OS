<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ケタ感</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* 方眼紙のノートに、蛍光ペンで「自分の幅」を引く。目盛りは常に対数。 */
:root{--paper:#eef2f4;--sheet:#fbfcfd;--ink:#14213d;--sub:#5a6578;--grid:#d5dde5;--mark:#ffe14d;--hit:#1b7f4b;--miss:#c0392b;
 --f-disp:"Dela Gothic One","Hiragino Sans",sans-serif;--f-body:"Zen Kaku Gothic New","Hiragino Sans",sans-serif;--f-num:"IBM Plex Mono",ui-monospace,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0e1626;--sheet:#152035;--ink:#e8edf5;--sub:#9aa7bd;--grid:#253350;--mark:#c9a81e;--hit:#5fd394;--miss:#ff7b6b;color-scheme:dark}}
:root[data-theme="dark"]{--paper:#0e1626;--sheet:#152035;--ink:#e8edf5;--sub:#9aa7bd;--grid:#253350;--mark:#c9a81e;--hit:#5fd394;--miss:#ff7b6b;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--f-body);line-height:1.65;
 background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}
main{max-width:520px;margin:0 auto;padding:20px 16px 48px}
h1{font-family:var(--f-disp);font-weight:400;font-size:2.6rem;margin:8px 0 0;letter-spacing:.04em;text-wrap:balance}
.lead{color:var(--sub);margin:2px 0 18px}
.card{background:var(--sheet);border:1.5px solid var(--ink);border-radius:4px;padding:18px;margin-bottom:14px;box-shadow:3px 3px 0 var(--ink)}
.prog{display:flex;gap:6px;margin-bottom:12px}.prog i{flex:1;height:6px;background:var(--grid)}.prog i.on{background:var(--ink)}
.qn{color:var(--sub);font-size:.8rem;letter-spacing:.08em}.q{font-size:1.2rem;font-weight:700;margin:4px 0 12px;text-wrap:balance}
label{display:block;font-size:.85rem;color:var(--sub);margin-top:10px}
.row{display:flex;align-items:center;gap:8px}
input{flex:1;min-width:0;font:500 1.25rem var(--f-num);padding:10px 12px;border:1.5px solid var(--ink);border-radius:4px;background:var(--paper);color:var(--ink);width:100%}
input:focus{outline:3px solid var(--mark);outline-offset:1px}
.unit{min-width:3em;color:var(--sub)}
.pv{font:500 .85rem var(--f-num);color:var(--sub);min-height:1.4em}
button{font:700 1rem var(--f-body);border:1.5px solid var(--ink);border-radius:4px;padding:14px;width:100%;background:var(--ink);color:var(--sheet);cursor:pointer;margin-top:12px}
button:focus-visible{outline:3px solid var(--mark);outline-offset:2px}
button.ghost{background:var(--sheet);color:var(--ink)}
.err{color:var(--miss);font-size:.85rem;min-height:1.3em}
.bar{position:relative;height:50px;margin:20px 0 6px}
.bar .axis{position:absolute;top:24px;left:0;right:0;height:1.5px;background:var(--ink)}
.bar .band{position:absolute;top:14px;height:22px;background:var(--mark);opacity:.85}
.bar .pin{position:absolute;top:4px;width:3px;height:42px;background:var(--miss);transform:translateX(-1px)}
.bar .pin.ok{background:var(--hit)}
.bar .t{position:absolute;top:-6px;font-size:.7rem;color:var(--sub);transform:translateX(-50%);white-space:nowrap}
.big{font-family:var(--f-disp);font-size:2.2rem;line-height:1.2}
.big small{font-family:var(--f-body);font-size:1rem}
.hit{color:var(--hit)}.miss{color:var(--miss)}
.src{font-size:.75rem;color:var(--sub);margin-top:6px}.src a{color:var(--sub)}
.grid{font-size:1.6rem;letter-spacing:.15em}
.meter{height:14px;border:1.5px solid var(--ink);position:relative;margin:10px 0}
.meter b{position:absolute;left:0;top:0;bottom:0;background:var(--mark)}
.meter s{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--ink);left:90%}
.how ol{padding-left:1.3em;margin:0 0 8px}.how li{margin-bottom:4px}
.small{font-size:.85rem;color:var(--sub)}
.num{font-family:var(--f-num)}
@media (prefers-reduced-motion:no-preference){.band{animation:draw .5s ease-out both;transform-origin:left}@keyframes draw{from{transform:scaleX(0)}}}
</style>
<main id="app"></main>
<script src="questions.js"></script>
<script>
const Z=0.1, K=25, N=5, KEY="keta-v1";
const $=s=>document.querySelector(s), app=$("#app");
const store={get(){try{return JSON.parse(localStorage.getItem(KEY))||{}}catch(e){return{}}},set(v){try{localStorage.setItem(KEY,JSON.stringify(v))}catch(e){}}};

// "1.2万" "3億" "12,000" を数値に
function parse(s){
  if(!s)return NaN; s=s.normalize("NFKC").replace(/[,\s]/g,"");
  if(!/^(\d*\.?\d+(千万|兆|億|万|千)?)+$/.test(s))return NaN; // 「1万2000」「3億5千万」も読む
  let tot=0,cur=0; const U={千万:1e7,兆:1e12,億:1e8,万:1e4,千:1e3};
  for(const [,num,u] of s.matchAll(/(\d*\.?\d+)(千万|兆|億|万|千)?/g)){const v=parseFloat(num);
    if(u==="千"){cur+=v*1e3}else if(u){tot+=(cur+v)*U[u];cur=0}else cur+=v}
  const r=tot+cur; return Number.isFinite(r)?r:NaN;
}
function fmt(x){
  if(!isFinite(x))return"";
  const a=Math.abs(x), r=v=>(+v.toPrecision(3)).toLocaleString("ja-JP");
  if(a>=1e12)return r(x/1e12)+"兆"; if(a>=1e8)return r(x/1e8)+"億"; if(a>=1e4)return r(x/1e4)+"万";
  return r(x);
}
function score(l,u,x){ // log10空間のWinkler区間スコア → 点数
  const L=Math.log10(l),U=Math.log10(u),X=Math.log10(x);
  let s=U-L; if(X<L)s+=2/Z*(L-X); if(X>U)s+=2/Z*(X-U);
  return Math.round(100-K*s);
}
// 日付から決まる問題（全員同じ）
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function today(){const d=new Date(Date.now()+9*3600e3);return d.toISOString().slice(0,10)}
function dayNo(){return Math.floor((Date.parse(today())-Date.parse("2026-10-06"))/864e5)+1}
function pick(seedStr){
  let h=0;for(const c of seedStr)h=Math.imul(31,h)+c.charCodeAt(0)|0;
  const r=rng(h), a=[...QUESTIONS]; for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  const out=[];for(const q of a){if(q.id===30&&out.some(x=>x.id===7)||q.id===7&&out.some(x=>x.id===30))continue;out.push(q);if(out.length===N)break}
  return out;
}

let S, DB=null;
(async()=>{try{DB=await window.claude?.use("db")}catch(e){}})();
async function saveAns(q,l,h,hit){if(!DB||S.practice)return;try{await DB.collection("answers").add({qid:q.id,lo:l,hi:h,hit,day:S.day,at:Date.now()})}catch(e){}}
async function crowd(q){if(!DB)return null;try{const snap=await DB.collection("answers").where("qid","==",q.id).limit(500).get();
  const rows=(snap.docs||[]).map(d=>typeof d.data==="function"?d.data():d);if(!rows.length)return null;
  return{n:rows.length,hit:rows.filter(r=>r.hit).length}}catch(e){return null}}
function start(practice){
  S={practice,day:today(),qs:pick(practice?String(Math.random()):today()),i:0,res:[]};
  ask();
}
function prog(){return`<div class="prog">${Array.from({length:N},(_,k)=>`<i class="${k<=S.i?"on":""}"></i>`).join("")}</div>`}
function ask(){
  const q=S.qs[S.i];
  app.innerHTML=`${prog()}<div class="card">
   <div class="qn">第${S.i+1}問 / ${N}</div><div class="q">${q.q}</div>
   <div class="small">「90%の自信で、この間に入る」と言える幅を答えてください。</div>
   <label>下限（これより小さいことはまずない）</label>
   <div class="row"><input id="lo" inputmode="decimal" autocomplete="off" placeholder="例 3000 / 1.2万"><span class="unit">${q.unit}</span></div><div class="pv" id="plo"></div>
   <label>上限（これより大きいことはまずない）</label>
   <div class="row"><input id="hi" inputmode="decimal" autocomplete="off" placeholder="例 5万 / 2億"><span class="unit">${q.unit}</span></div><div class="pv" id="phi"></div>
   <div class="err" id="err"></div>
   <button id="go">答え合わせ</button></div>`;
  const upd=()=>{const l=parse($("#lo").value),h=parse($("#hi").value);
    $("#plo").textContent=isFinite(l)?"＝ "+fmt(l)+" "+q.unit:""; $("#phi").textContent=isFinite(h)?"＝ "+fmt(h)+" "+q.unit:"";};
  $("#lo").oninput=$("#hi").oninput=upd; $("#lo").focus();
  $("#hi").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();$("#go").click()}};
  $("#lo").onkeydown=e=>{if(e.key==="Enter"&&!e.isComposing){e.preventDefault();$("#hi").focus()}};
  $("#go").onclick=()=>{
    const l=parse($("#lo").value),h=parse($("#hi").value);
    if(!(l>0)||!(h>0))return $("#err").textContent="数字を入れてください（「万」「億」も使えます）";
    if(l>h)return $("#err").textContent="下限が上限より大きくなっています";
    reveal(l,h);
  };
}
function bar(l,h,x){
  const L=Math.log10(l),H=Math.log10(h),X=Math.log10(x);
  const lo=Math.min(L,X)-.3, hi=Math.max(H,X)+.3, p=v=>((v-lo)/(hi-lo)*100).toFixed(1)+"%";
  return`<div class="bar"><div class="axis"></div><div class="band" style="left:${p(L)};width:calc(${p(H)} - ${p(L)})"></div>
   <div class="pin ${l<=x&&x<=h?"ok":""}" style="left:${p(X)}"></div><span class="t" style="left:${p(X)}">正解</span></div>`;
}
function reveal(l,h){
  const q=S.qs[S.i], hit=l<=q.answer&&q.answer<=h, pt=score(l,h,q.answer), ratio=h/l;
  S.res.push({id:q.id,l,h,hit,pt,ratio});
  const note=hit?(ratio<3?"狭い幅で当てました。お見事。":ratio<30?"幅の中に入りました。":"当たりましたが、幅が広すぎて点が伸びません。")
                :(q.answer<l?`正解は下限の${(l/q.answer).toFixed(1)}分の1でした。`:`正解は上限の${(q.answer/h).toFixed(1)}倍でした。`);
  app.innerHTML=`${prog()}<div class="card"><div class="qn">第${S.i+1}問</div><div class="q">${q.q}</div>
   <div class="big">${fmt(q.answer)} <small>${q.unit}</small></div>
   <div class="small">あなたの幅：${fmt(l)}〜${fmt(h)} ${q.unit}</div>${bar(l,h,q.answer)}
   <div class="${hit?"hit":"miss"}" style="font-weight:700">${hit?"的中":"はずれ"}　${pt>0?"+":""}${pt}点</div>
   <div class="small">${note}</div>
   <div class="small" id="crowd"></div>
   <div class="src">出典：<a href="${q.url}" target="_blank" rel="noopener">${q.source}</a>（${q.year}）</div>
   <button id="nx">${S.i<N-1?"次の問題":"結果を見る"}</button></div>`;
  saveAns(q,l,h,hit).then(()=>crowd(q)).then(c=>{const el=$("#crowd");if(c&&el)el.textContent=`みんなの的中率 ${Math.round(c.hit/c.n*100)}%（${c.n}人中${c.hit}人）`});
  const t0=Date.now(); // 同じEnterで答え合わせを飛ばさない
  $("#nx").onclick=()=>{if(Date.now()-t0<500)return; S.i++; S.i<N?ask():result()}; setTimeout(()=>$("#nx").focus(),500);
}
function result(){
  const r=S.res, tot=r.reduce((a,b)=>a+b.pt,0), hits=r.filter(x=>x.hit).length;
  const st=store.get(); st.all=st.all||{n:0,h:0};
  if(!S.practice&&st.last!==S.day){st.last=S.day;st.days=(st.days||0)+1;st.best=Math.max(st.best??-1e9,tot)}
  st.all.n+=r.length; st.all.h+=hits; store.set(st);
  const rate=st.all.h/st.all.n, grid=r.map(x=>!x.hit?"❌":x.ratio<3?"🎯":x.ratio<30?"🟧":"⬜").join("");
  const diag=st.all.n<10?`まだ${st.all.n}問ぶん。10問を超えると診断の精度が上がります。`:
    rate<.6?"かなりの自信過剰です。「まずない」と思った外側に、正解がよくあります。":
    rate<.8?"やや自信過剰です。幅をもう少し広げると点が伸びます。":
    rate<=.97?"よく較正されています。自分の知らなさを正しく分かっています。":"慎重すぎます。もっと狭くしても当たります。";
  const share=`ケタ感 #${dayNo()}${S.practice?"（練習）":""} ${tot}点\n${grid}\n90%幅の的中 ${hits}/${N}`;
  app.innerHTML=`<h1>結果</h1><div class="card"><div class="big">${tot}点</div><div class="grid">${grid}</div>
   <div>90%のつもりの幅で、当たったのは <b>${hits}/${N}</b> 問</div></div>
   <div class="card"><b>あなたの「自信」の正確さ</b>
   <div class="meter"><b style="width:${(rate*100).toFixed(0)}%"></b><s></s></div>
   <div class="small">これまでの的中率 ${(rate*100).toFixed(0)}%（${st.all.h}/${st.all.n}問）。縦線の90%が理想です。</div>
   <p>${diag}</p>
   <div class="small">多くの人は、90%のつもりの幅でも半分ほどしか当たりません（Alpert & Raiffa 1982 など）。</div></div>
   <button id="sh">結果をコピーして共有</button>
   <button class="ghost" id="pr">練習でもう5問</button><button class="ghost" id="hm">トップへ</button>`;
  $("#sh").onclick=async()=>{try{if(navigator.share)await navigator.share({text:share});else{await navigator.clipboard.writeText(share);$("#sh").textContent="コピーしました"}}catch(e){}};
  $("#pr").onclick=()=>start(true); $("#hm").onclick=home;
}
function home(){
  const st=store.get(), done=st.last===today();
  app.innerHTML=`<h1>ケタ感</h1><p class="lead">数字を「幅」で当てる、1日5問のゲーム。</p>
   <div class="card how"><ol>
   <li>「日本の島の数は？」のような問題が出ます。</li>
   <li>ぴったり当てる必要はありません。<b>90%の自信で入る幅</b>を答えます。</li>
   <li>幅が狭いほど高得点。外れると、はみ出した分だけ大きく減点。</li></ol>
   <div class="small">広げすぎても、狭めすぎても損をします。正直な90%がいちばん点が出る採点です。</div></div>
   <button id="st">${done?"今日の5問はプレイ済み（練習する）":`今日の5問 #${dayNo()}`}</button>
   ${st.all?`<div class="small" style="margin-top:12px">これまで ${st.all.n}問 / 的中率 ${(st.all.h/st.all.n*100).toFixed(0)}%</div>`:""}`;
  $("#st").onclick=()=>start(done);
}
home();
</script>
