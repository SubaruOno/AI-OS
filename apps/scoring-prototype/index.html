<script>
// ===== 試合の設定（テスト試合と同じダミー） =====
const TEAMS=[
 {name:'にせあめりか',order:[15,5,6,9,8,7,4,3,2],pos:[4,5,10,8,9,7,6,3,2],bats:['右','左','左','左','左','両','左','両','右'],P:1,throws:'左'},
 {name:'にせじゃぱん',order:[7,15,8,9,4,5,6,3,2],pos:[9,10,7,8,3,4,5,6,2],bats:['左','両','左','左','右','左','左','右','右'],P:1,throws:'右'}];
const PT=[['特殊','star'],['TS','ts'],['FB','circle','87 ~ 147'],['SL','tri_r','78 ~ 131'],['SW','sw'],['CT','ct'],['CB','tri_d'],['SP','diamond','86 ~ 89'],['CH','square'],['SI','tri_u','121 ~ 121'],['KN','penta'],['KC','shield'],['OT','star']];
const PT_POS=[[100,224],[184,224],[100,276],[184,276],[100,328],[184,328],[100,380],[184,380],[100,432],[184,432],[100,484],[184,484],[100,536]];
// 投球結果ボタン：[表示, 位置x, y, 背景, 文字色, 種類]
const PRES=[['空振',221,594,'#fff9db','#c7a200','S'],['見送',221,632,'#fff9db','#c7a200','S'],['ボール',221,670,'#e6fcf5','#12b886','B'],['ファウル',221,708,'#e7f5ff','#339af0','FO'],
 ['逆球',342,594,'#f3f0ff','#343a40','F'],['ワンバウンド',342,632,'#f3f0ff','#343a40','F'],['クイック',342,670,'#f3f0ff','#343a40','F'],
 ['ﾜｲﾙﾄﾞﾋﾟｯﾁ',463,594,'#fff0f6','#f783ac','F'],['ﾊﾟｽﾎﾞｰﾙ',463,632,'#fff0f6','#f783ac','F'],['申告敬遠',463,670,'#fff9db','#c7a200','IBB'],['ボーク',463,708,'#edf2ff','#4263eb','BK']];
const SIDE=[['犠打','sac','#e7f5ff','#1971c2'],['犠飛','sf','#e7f5ff','#1971c2'],['犠打失策','e','#e7f5ff','#1971c2'],['犠飛失策','e','#e7f5ff','#1971c2'],['死球','hbp','#e6fcf5','#0ca678'],['振り逃げ','e','#e6fcf5','#0ca678'],['野選','e','#fff0f3','#e03131'],['打撃妨害','e','#fff0f3','#e03131'],['守備妨害','out','#fff0f3','#e03131'],['走塁妨害','e','#fff0f3','#e03131']];
const BOT=[['凡打',774,578,56,'out','#e7f5ff','#1971c2'],['失策出塁',831,578,104,'e','#e7f5ff','#1971c2'],['単打',937,578,70,1,'#fff0f3','#212529'],['三塁打',1008,578,70,3,'#fff0f3','#212529'],
 ['邪飛',774,609,56,'out','#e7f5ff','#1971c2'],['ｽﾘｰﾊﾞﾝﾄ失敗',831,609,104,'out','#e7f5ff','#1971c2'],['二塁打',937,609,70,2,'#fff0f3','#212529'],['本塁打',1008,609,70,4,'#fff0f3','#212529']];
const STRATS={バント:['セーフティーバント（1塁側）','セーフティーバント（3塁側）','セーフティーバント（投手方向）','スリーバント失敗','バントファウル','スクイズ','スクイズファウル','送りバント','セフティ','バスター','ドラッグ'],盗塁:['盗塁失敗','盗塁成功','ディレイドスティール','盗塁企画','ダブルスチール','ディレード'],エンドラン:['ヒットエンドラン','バスターエンドラン','HAR','RAH','BSAR','BAR']};
// 実測した野手・塁の位置（280×280、守備位置の番号で）
const POSXY={1:[77,207],2:[32,252],3:[137,257],4:[142,197],5:[27,152],6:[87,142],7:[77,77],8:[182,107],9:[207,212]};
const BASEXY={0:[46,238],1:[113,238],2:[118,163],3:[46,165]};
const HOME=[46,238];
const ERRS=['ファンブル','悪送球','落球','捕球ミス','送球ミス','トンネル','後逸','インターフェア','フィルダース','走塁妨害','ミスプレイ'];
// 結果ごとの球の色（コースの図）
const RCOL={見送:'#ff8a65',空振:'#e64980',ボール:'#4dabf7',ファウル:'#fcc419'};

// ===== データ：1ページ＝1プレイ。入力だけを持ち、状況は毎回最初から計算し直す =====
const S={pov:false,fielderMode:true};
let pages=[blank()],cur=0,popup=null,runnerSel=null,pickMode=false,openMenu=null,errMode=false,homeOpen=false;
function blank(){return{pitch_type:null,course:null,catcher_mitt_position:0,ball_speed:'',res:null,flags:[],plan:{},batted_ball:null,feature:0,rank:null,catch_fielder:[],ra:{},pickoff_throw_to:0,skip:false,skipOut:null,memo:'',time:null,handP:null,handB:null}}
function cp(){return pages[cur]}
function initState(){return{inn:1,half:0,score:[0,0],hits:[0,0],line:[[],[]],outs:0,b:0,s:0,bases:[null,null,null],bi:[0,0],pcount:{},paLog:{}}}
const batterOf=st=>TEAMS[st.half].order[st.bi[st.half]];
const pitcherOf=st=>TEAMS[1-st.half].P;
function endPA(st,txt){const t=st.half,no=batterOf(st);(st.paLog[t+'-'+no]=st.paLog[t+'-'+no]||[]).push(txt);st.bi[t]=(st.bi[t]+1)%9;st.b=0;st.s=0}
function addRun(st,n){if(!n)return;st.score[st.half]+=n;const L=st.line[st.half];L[st.inn-1]=(L[st.inn-1]||0)+n}
function advanceAll(st,n,batter){const nb=[null,null,null];let r=0;for(let i=2;i>=0;i--)if(st.bases[i]!=null){const to=i+n;if(to>=3)r++;else nb[to]=st.bases[i]}if(batter!=null){if(n>=4)r++;else nb[n-1]=batter}st.bases=nb;addRun(st,r)}
function force(st,bat){const b=st.bases;if(b[0]!=null){if(b[1]!=null){if(b[2]!=null)addRun(st,1);b[2]=b[1]}b[1]=b[0]}b[0]=bat}
const cfPos=c=>typeof c==='object'?c.pos:c;
function dirTxt(p){if(!p.catch_fielder.length)return'';return'投捕一二三遊左中右'[cfPos(p.catch_fielder[0])-1]}
// BASSで確かめた自動の動き。走者が自動で進むのは四死球の押し出しと本塁打だけ。
function autoMoves(st,p){
 const k=p.res&&p.res.kind,m={};
 const walk=(k==='B'&&st.b>=3)||k==='IBB'||k==='hbp';
 if(walk){m[0]={to:1};let need=1;for(let i=1;i<=3;i++){if(st.bases[i-1]!=null&&need===i){m[i]={to:i+1};need=i+1}}}
 else if(k===4){m[0]={to:4};[1,2,3].forEach(i=>{if(st.bases[i-1]!=null)m[i]={to:4}})}
 else if(typeof k==='number')m[0]={to:k};
 else if(k==='out'||k==='sac')m[0]={out:true};
 else if(k==='e')m[0]={to:1};
 return m}
function moves(st,p){const m=autoMoves(st,p);for(const[b,a]of Object.entries(p.ra)){if(a.back){delete m[b];continue}m[b]=Object.assign({},m[b]||{},a);if(a.out)delete m[b].to;if(a.to)delete m[b].out}return m}
function applyPage(st,p){
 const t=st.half,bat=batterOf(st),pid=pitcherOf(st),mv=moves(st,p);
 const move=()=>{let runs=0;const nb=[null,null,null];
  for(let i=3;i>=1;i--){const id=st.bases[i-1];if(id==null)continue;const a=mv[i];
   if(!a||(!a.out&&!a.to)){nb[i-1]=id;continue}
   if(a.out){st.outs++;continue}
   if(a.to>=4){if(!a.homeOut)runs++;else st.outs++}else nb[a.to-1]=id}
  const b=mv[0];if(b&&b.out)st.outs++;else if(b&&b.to){if(b.to>=4){if(!b.homeOut)runs++;else st.outs++}else nb[b.to-1]=bat}
  st.bases=nb;addRun(st,runs)};
 if(p.pickoff_throw_to){move();three(st);return}
 if(p.skip){if(!mv[0]||(!mv[0].out&&!mv[0].to))return;const o=!!mv[0].out;move();endPA(st,o?'凡退':'出塁');three(st);return}
 if(!p.res)return;const k=p.res.kind;
 if(k!=='BK')st.pcount[pid]=(st.pcount[pid]||0)+1;
 if(k==='S')st.s=Math.min(st.s+1,3);else if(k==='B')st.b=Math.min(st.b+1,4);else if(k==='FO'){if(st.s<2)st.s++}
 const f=mv[0],ended=f&&(f.out||f.to);
 move();
 if(ended){let txt=p.res.label;
  if(k==='S')txt=p.res.label==='空振'?'空三振':'見三振';else if(k==='B')txt='四球';else if(k==='IBB')txt='敬遠';else if(k==='hbp')txt='死球';
  else if(typeof k==='number'){st.hits[t]++;txt=dirTxt(p)+['','安','二','三','本'][k]}
  else if(k==='out')txt=p.res.label==='邪飛'?dirTxt(p)+'邪飛':dirTxt(p)+(p.feature===2?'飛':p.feature===3?'直':'ゴ');
  else if(k==='sf')txt=dirTxt(p)+'犠飛';else if(k==='sac')txt='犠打';else if(p.res.label==='失策出塁')txt=dirTxt(p)+'失';
  endPA(st,txt)}
 three(st)}
// 確定できるか（BASSと同じ警告）
function checkCommit(st,p){
 if(p.skip&&!(p.ra[0]&&(p.ra[0].out||p.ra[0].to)))return'打席結果（アウトまたは進塁）を入力してください';
 if(!p.res&&!p.skip&&!p.pickoff_throw_to)return'入力がありません';
 if(p.res&&p.res.kind==='FO'&&!p.feature)return'打球の質を選択してください';
 const bi=st.bi[st.half];if(TEAMS[st.half].bats[bi]==='両'&&!p.handB)return'右打席・左打席を選んでください';
 if(p.res){const k=p.res.kind,mv=moves(st,p)[0],ended=mv&&(mv.out||mv.to);
  const needs=(k==='S'&&st.s>=2)||k==='sf'||(k==='e'&&false);
  if(needs&&!ended)return'打席結果（アウトまたは進塁）を入力してください'}
 return null}
function three(st){if(st.outs>=3){st.outs=0;st.b=0;st.s=0;st.bases=[null,null,null];if(st.half){st.half=0;st.inn++}else st.half=1}}
function stateAt(i){const st=initState();for(let k=0;k<i;k++)applyPage(st,pages[k]);return st}

// 打球の角度と方向区分（実測した仕様）
function angleOf(x,y){let a=Math.atan2(HOME[1]-y,x-HOME[0])*180/Math.PI;return a<0?a+360:a}

function shape(sh,fill,stroke,pov,ph){let flip=(ph==='左')!==pov;const f=flip?'transform="scale(-1,1)"':'';const st=`fill="${fill}" stroke="${stroke}" stroke-width="1"`;const ln=`fill="none" stroke="${fill}" stroke-width="2"`;

function solidShape(sh,col,pov,ph){return shape(sh,col,'none',pov,ph).replace(/fill="none" stroke="([^"]+)" stroke-width="2"/g,'fill="$1" stroke="#fff" stroke-width="1"')}

function openErr(pos){const d=document.createElement('div');d.className='menu';d.style.left='960px';d.style.top='340px';d.style.padding='8px 10px';
 d.innerHTML=ERRS.map((e,i)=>`<label style="display:block;padding:3px 0;font-size:13px"><input type="checkbox" value="${i}"> ${e}</label>`).join('')+
  `<div style="display:flex;gap:4px;margin-top:6px"><span id="eok" style="background:#20c997;color:#fff;padding:5px 12px;border-radius:4px;cursor:pointer">OK</span><span onclick="this.closest('.menu').remove()" style="padding:5px 12px;cursor:pointer">キャンセル</span></div>`;
 stage.appendChild(d);d.querySelector('#eok').onclick=()=>{const ids=[...d.querySelectorAll('input:checked')].map(c=>ERRS[+c.value]);d.remove();if(!ids.length)return;cp().catch_fielder.push({pos,err:ids});render()}}
function runnerClick(b){closePop();const st=stateAt(cur);if(b>0&&st.bases[b-1]==null)return;
 runnerSel={b,type:'adv'};
 const mv=moves(st,cp())[b];let[x,y]=BASEXY[b];if(mv&&mv.to)[x,y]=mv.to>=4?[HOME[0]+14,HOME[1]]:BASEXY[mv.to];
 const fr=field.getBoundingClientRect(),sr=stage.getBoundingClientRect(),k=sr.width/1512;
 const d=document.createElement('div');d.className='pop';d.style.left=((fr.left-sr.left)/k+x*381/280+12)+'px';d.style.top=((fr.top-sr.top)/k+y*381/280-14)+'px';
 const items=b===0?[['⊘ アウト','#f03e5e','out'],['↺ 戻る','#868e96','back']]:[['⊘ アウト','#f03e5e','out'],['🏃 盗塁','#fab005','steal'],['↺ 戻る','#868e96','back']];
 d.innerHTML=items.map(([l,c,a])=>`<div style="background:${c}" onclick="runnerAct(${b},'${a}');event.stopPropagation()">${l}</div>`).join('');stage.appendChild(d);popup=d;render()}
function runnerAct(b,a){closePop();const p=cp();
 if(a==='back'){p.ra[b]={back:true};runnerSel=null;render();return}
 if(a==='out'){p.ra[b]={out:true};runnerSel=null;render();return}
 runnerSel={b,type:'steal'};render()}
function baseClick(base){const p=cp();
 if(pickMode){pickMode=false;p.pickoff_throw_to=base===4?0:base;p.res=null;stamp();render();return}
 if(runnerSel&&base>runnerSel.b){closePop();p.ra[runnerSel.b]={to:base,steal:runnerSel.type==='steal'};runnerSel=null;if(base===4)homeOpen=true;render()}}
function closePop(){if(popup){popup.remove();popup=null}}

function drawPie(){const c={};pages.forEach((q,i)=>{if(i<cur&&q.pitch_type)c[q.pitch_type]=(c[q.pitch_type]||0)+1});const tot=Object.values(c).reduce((a,b)=>a+b,0);
 const col={FB:'#f03e5e',SL:'#1c7ed6',CB:'#7048e8',CT:'#15aabf',CH:'#37b24d',SP:'#74c0fc',SI:'#fab005',SW:'#e64980',KN:'#868e96',KC:'#0ca678',TS:'#f76707',特殊:'#495057',OT:'#495057'};
 let s='',a0=-Math.PI/2;if(!tot)s='<circle cx="42.5" cy="42.5" r="41" fill="#f1f3f5"/>';
 Object.entries(c).forEach(([k,v])=>{const a1=a0+v/tot*2*Math.PI;s+=v===tot?`<circle cx="42.5" cy="42.5" r="41" fill="${col[k]}"/>`:`<path d="M42.5 42.5L${42.5+41*Math.cos(a0)} ${42.5+41*Math.sin(a0)}A41 41 0 ${a1-a0>Math.PI?1:0} 1 ${42.5+41*Math.cos(a1)} ${42.5+41*Math.sin(a1)}Z" fill="${col[k]}" stroke="#fff"/>`;a0=a1});pie.innerHTML=s}

// BASSと同じ形の記録（確認用、Dキーで表示）
function record(st,p){const bb=p.batted_ball;return{page:cur+1,inning:st.inn,top_bottom:st.half===0,pre_ball_count:st.b,pre_strike_count:st.s,pre_out_count:st.outs,
 course_x:p.course?+p.course[0].toFixed(2):0,course_y:p.course?+p.course[1].toFixed(2):0,catcher_mitt_position:p.catcher_mitt_position,pitch_type:p.pitch_type,ball_speed:+p.ball_speed||0,
 result:p.res&&p.res.label,flags:p.flags,plan:p.plan,pickoff_throw_to:p.pickoff_throw_to,
 batted_ball:{x:bb?+bb.x.toFixed(2):0,y:bb?+bb.y.toFixed(2):0,angle:bb?+bb.angle.toFixed(2):0,direction_3_division:bb?bb.direction_3_division:0,direction_5_division:bb?bb.direction_5_division:0,feature:p.feature,rank:p.rank==null?0:p.rank},
 catch_fielder:p.catch_fielder.map((c,i,a)=>({index:i,position:cfPos(c),throw_to:a[i+1]?cfPos(a[i+1]):0,error:typeof c==='object'?c.err:[]})),moves:moves(st,p)}}

// ===== 操作 =====
function stamp(){if(!cp().time)cp().time=new Date().toTimeString().slice(0,8)}
function key(d){const p=cp();if(d==='C')p.ball_speed='';else if(p.ball_speed.length<3)p.ball_speed+=d;render()}
// 結果を選び直すと、その結果に付いていた走者の操作と打球の質は外れる（BASSと同じ）。盗塁は残す。
function setRes(r){const p=cp();p.res=r;p.skip=false;p.pickoff_throw_to=0;p.feature=0;for(const b of Object.keys(p.ra))if(!p.ra[b].steal)delete p.ra[b];stamp()}
function pitchRes(l,k){const p=cp();if(k==='F'){p.flags=p.flags.includes(l)?p.flags.filter(x=>x!==l):[...p.flags,l];render();return}
 if(p.res&&p.res.label===l){setRes(null);render();return}
 const st=stateAt(cur);
 if(k==='B'&&st.b>=3){modal_('四球になって打者は自動的に1塁に進出。よろしいですか？','OK',()=>{setRes({label:l,kind:k});render()});return}
 setRes({label:l,kind:k});render()}
function batRes(l,k){const p=cp();if(p.res&&p.res.label===l){setRes(null);render();return}setRes({label:l,kind:isNaN(+k)?k:+k});if(+k===4)homeOpen=true;render()}
function menu(k,el){if(openMenu){const same=openMenu.dataset.k===k;openMenu.remove();openMenu=null;if(same)return}
 const m=document.createElement('div');m.className='menu';m.dataset.k=k;m.style.left=el.style.left;m.style.top=(parseInt(el.style.top)+32)+'px';
 m.innerHTML=`<div onclick="setPlan('${k}',null)">✕ クリア</div><div style="border-top:1px solid #eee;padding:0;margin:4px 0"></div>`+STRATS[k].map(x=>`<div class="${cp().plan[k]===x?'act':''}" onclick="setPlan('${k}','${x}')">${x}</div>`).join('');stage.appendChild(m);openMenu=m}
function setPlan(k,v){const p=cp();if(v&&p.plan[k]===v)v=null;if(v)p.plan[k]=v;else delete p.plan[k];if(openMenu){openMenu.remove();openMenu=null}render()}
function clearPage(){pages[cur]=blank();pickMode=false;runnerSel=null;render()}
function askSkip(){modal_('打席をスキップしますか?','OK',()=>{const p=cp();p.skip=true;p.res=null;p.pickoff_throw_to=0;stamp();render()})}
function askEnd(){modal_('入力を終了しますか?','終了',openSummary)}
function commit(){const p=cp(),st=stateAt(cur);
 const err=checkCommit(st,p);if(err){toast(err);return}
 const after=JSON.parse(JSON.stringify(st));applyPage(after,p);
 const go_=()=>{if(cur===pages.length-1)pages.push(blank());cur++;pickMode=false;errMode=false;homeOpen=false;runnerSel=null;closePop();render()};
 if(after.half!==st.half){const t=after.half,i0=after.bi[t];
  const rows=TEAMS[t].order.map((no,i)=>`<tr style="${i===i0?'background:#20c997;color:#fff':''}"><td>${i+1}</td><td>${no}</td><td>${TEAMS[t].bats[i]}</td></tr>`).join('');
  mtext.innerHTML=`<div style="font-size:18px;margin-bottom:8px">イニングの確認</div><table class="sb" style="position:static;width:100%"><tr><td>打順</td><td>#</td><td>打</td></tr>${rows}</table><div style="display:flex;gap:10px;margin-top:8px;font-size:13px"><span>${TEAMS[0].name} ${after.score[0]}</span><span>${TEAMS[1].name} ${after.score[1]}</span></div>`;
  mok.textContent='OK';mok.style.background='#12b886';modal.style.display='flex';mok.onclick=()=>{closeModal();go_()};return}
 go_()}
function go(i){if(i<0||i>=pages.length)return;cur=i;pickMode=false;runnerSel=null;closePop();render()}
function goLast(){go(Math.max(0,pages.length-2)===cur?pages.length-1:pages.length-1)}
function undoLast(){if(cur===pages.length-1&&cur>0){pages.pop();cur--;pages[cur]=pages[cur];render()}}
function toast(t,ms=2400){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(e._t);e._t=setTimeout(()=>e.style.display='none',ms)}
function modal_(t,okl,ok){mtext.innerHTML='';mtext.textContent=t;mok.textContent=okl;mok.style.background=okl==='終了'?'#f03e5e':'#12b886';modal.style.display='flex';mok.onclick=()=>{closeModal();ok()}}
function closeModal(){modal.style.display='none'}
let swOn=false,swT=0,swS=0;function sw(){swOn=!swOn;if(swOn)swS=performance.now()-swT}
setInterval(()=>{if(swOn){swT=performance.now()-swS;timer.textContent=new Date(swT).toISOString().slice(14,22)}},50);
addEventListener('keydown',e=>{if(e.key==='d'&&e.target.tagName!=='TEXTAREA')dbg.style.display=dbg.style.display==='block'?'none':'block'});

// 入力終了 → 試合編集（打席を押すとその打席の1球目へ）
function openSummary(){const cells={};let st=initState();
 pages.forEach((p,i)=>{if(i===pages.length-1)return;const t=st.half,b=st.bi[t],k=t+'-'+b+'-'+st.inn,before=st.bi[t];if(!cells[k])cells[k]={start:i};applyPage(st,p);if(st.bi[t]!==before||st.half!==t){const log=st.paLog[t+'-'+TEAMS[t].order[b]];if(log)cells[k].txt=log[log.length-1]}});
 let h=`<div style="font-size:26px;margin-bottom:12px">試合編集</div><button style="right:14px;top:14px;width:120px;height:34px" onclick="summary.style.display='none'">入力に戻る</button>`;
 [0,1].forEach(t=>{h+=`<div style="margin:14px 0 4px;color:#4263eb">${TEAMS[t].name}</div><table class="sb" style="position:static;width:100%"><tr><td style="width:60px">No</td><td style="width:60px">#</td><td style="width:200px">名前</td>`+[1,2,3,4,5,6,7,8,9].map(i=>`<td>${i}</td>`).join('')+'</tr>';
  TEAMS[t].order.forEach((no,b)=>{h+=`<tr><td style="height:46px">${b+1}</td><td>${no}</td><td style="background:#fff9db">✎ ${no}</td>`+[1,2,3,4,5,6,7,8,9].map(i=>{const c=cells[t+'-'+b+'-'+i];return`<td>${c?`<span onclick="summary.style.display='none';go(${c.start})" style="display:block;margin:4px;padding:8px;background:#f1f3f5;cursor:pointer;color:${/安|二|三|本/.test(c.txt||'')?'#e03131':'#212529'}">${c.txt||'入力中'}</span>`:''}</td>`}).join('')+'</tr>'});h+='</table>'});
 sumbody.innerHTML=h;summary.style.display='flex'}

function fit(){const s=Math.min(innerWidth/1512,innerHeight/771);stage.style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();render();
</script>
</body>
</html>
